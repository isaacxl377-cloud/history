<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>初二历史月考选择题速刷复习</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
    }
    :root {
      --primary: #2563eb;
      --primary-light: #eff6ff;
      --primary-dark: #1d4ed8;
      --success: #16a34a;
      --success-light: #dcfce7;
      --danger: #dc2626;
      --danger-light: #fee2e2;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }
    html, body {
      height: 100dvh;
      max-height: 100dvh;
      width: 100vw;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
      background: var(--bg);
      color: var(--text-main);
    }
    #app {
      height: 100dvh;
      max-height: 100dvh;
      width: 100%;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    /* 视图基础 */
    .view {
      display: none;
      height: 100%;
      width: 100%;
      flex-direction: column;
      justify-content: space-between;
      padding: env(safe-area-inset-top, 10px) 14px env(safe-area-inset-bottom, 10px) 14px;
    }
    .view.active {
      display: flex;
    }

    /* 顶部导航条 */
    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
      border-bottom: 1px solid var(--border);
      min-height: 38px;
    }
    .back-btn {
      background: none;
      border: none;
      font-size: 13.5px;
      color: var(--primary);
      cursor: pointer;
      font-weight: 600;
      padding: 3px 6px;
    }
    .page-title {
      font-size: 13.5px;
      font-weight: 600;
      color: var(--text-muted);
    }

    /* 首页样式 */
    .home-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 0 8px;
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: var(--primary-light);
      color: var(--primary);
      border-radius: 999px;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 12px;
    }
    .home-title {
      font-size: 24px;
      font-weight: 800;
      color: #1e293b;
      margin-bottom: 8px;
      line-height: 1.25;
    }
    .home-desc {
      font-size: 13px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 18px;
    }
    .stat-pill {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 5px 12px;
      background: #fff;
      border: 1px solid var(--border);
      border-radius: 20px;
      font-size: 12px;
      color: #475569;
      margin-bottom: 22px;
    }
    .home-actions {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    /* 答题区核心卡片 - 严格一屏紧凑布局，取消底部按钮后垂直居中 */
    .quiz-card {
      flex: 1;
      background: var(--card-bg);
      border-radius: 14px;
      padding: 12px 14px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      margin: 8px 0;
      border: 1px solid var(--border);
      box-shadow: 0 3px 12px -2px rgba(0, 0, 0, 0.05);
      min-height: 0;
    }
    .meta-tags {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 6px;
    }
    .meta-tag {
      font-size: 11px;
      background: #f1f5f9;
      color: #475569;
      padding: 2px 6px;
      border-radius: 4px;
      font-weight: 500;
    }
    .meta-source {
      font-size: 11px;
      color: #94a3b8;
    }

    .question-box {
      margin-bottom: 8px;
    }
    .question-text {
      font-size: 15px;
      line-height: 1.45;
      color: #1e293b;
      font-weight: 600;
    }

    /* 选项列表 */
    .options-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }
    .option-item {
      padding: 9px 12px;
      border: 1.5px solid var(--border);
      border-radius: 9px;
      font-size: 13.5px;
      line-height: 1.35;
      color: #334155;
      background: #fff;
      cursor: pointer;
      display: flex;
      align-items: center;
      transition: all 0.15s ease;
      touch-action: manipulation;
      user-select: none;
    }
    .option-item:active:not(.locked) {
      background: var(--primary-light);
      border-color: var(--primary);
    }
    .option-item.correct-reveal {
      border-color: var(--success) !important;
      background: var(--success-light) !important;
      color: #166534 !important;
      font-weight: 700;
    }
    .option-item.wrong-selected {
      border-color: var(--danger) !important;
      background: var(--danger-light) !important;
      color: #991b1b !important;
      font-weight: 700;
    }

    /* 反馈判定区 */
    .feedback-box {
      margin-top: 8px;
      padding: 8px 12px;
      border-radius: 8px;
      font-size: 12.5px;
      display: none;
      line-height: 1.4;
      animation: fadeIn 0.15s ease-in-out;
    }
    .feedback-box.correct {
      display: flex;
      flex-direction: column;
      background: var(--success-light);
      color: #166534;
      border: 1px solid #bbf7d0;
    }
    .feedback-box.wrong {
      display: flex;
      flex-direction: column;
      background: var(--danger-light);
      color: #991b1b;
      border: 1px solid #fecaca;
    }
    .feedback-header {
      font-weight: 700;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 4px;
      font-size: 13px;
    }
    .explain-text {
      margin-top: 3px;
      color: #334155;
      font-size: 12px;
    }
    .next-tip {
      font-size: 11px;
      font-weight: 500;
      opacity: 0.85;
      margin-top: 4px;
      text-align: right;
    }

    /* 底部操作按钮 */
    .btn {
      width: 100%;
      height: 44px;
      border-radius: 10px;
      font-size: 15px;
      font-weight: 600;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.15s ease;
      touch-action: manipulation;
    }
    .btn-primary {
      background: var(--primary);
      color: #fff;
    }
    .btn-primary:active {
      background: var(--primary-dark);
      transform: scale(0.99);
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
      border: 1px solid var(--border);
    }
    .btn-secondary:active {
      background: #e2e8f0;
    }
    .btn:disabled, .btn.disabled {
      background: #e2e8f0 !important;
      color: #94a3b8 !important;
      border: none !important;
      cursor: not-allowed !important;
      transform: none !important;
      pointer-events: none;
    }

    /* 进度条 */
    .progress-bar-wrap {
      width: 100%;
      height: 4px;
      background: #e2e8f0;
      border-radius: 2px;
      overflow: hidden;
      margin-top: 3px;
    }
    .progress-bar-fill {
      height: 100%;
      background: var(--primary);
      width: 0%;
      transition: width 0.2s ease;
    }

    /* 结算页面 */
    .summary-card {
      flex: 1;
      background: #fff;
      border-radius: 16px;
      padding: 18px 14px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      border: 1px solid var(--border);
      margin: 10px 0;
    }
    .score-circle {
      width: 96px;
      height: 96px;
      border-radius: 50%;
      background: var(--primary-light);
      border: 4px solid var(--primary);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
    }
    .score-num {
      font-size: 26px;
      font-weight: 800;
      color: var(--primary);
      line-height: 1;
    }
    .score-label {
      font-size: 10.5px;
      color: var(--text-muted);
      margin-top: 3px;
    }
    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      width: 100%;
      margin-bottom: 14px;
    }
    .stat-item {
      background: #f8fafc;
      padding: 8px;
      border-radius: 8px;
      border: 1px solid var(--border);
    }
    .stat-val {
      font-size: 16px;
      font-weight: 700;
      color: #1e293b;
    }
    .stat-name {
      font-size: 10.5px;
      color: var(--text-muted);
      margin-top: 2px;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(3px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>

  <!-- 首页 -->

      </div>

  </div>

        </div>

        <div class="question-box">
          <p id="question-text" class="question-text"></p>
        </div>
      </div>

      <div>

          <!-- 选项由 JS 动态生成 -->
        </div>

        <div id="feedback-box" class="feedback-box">
          <div id="feedback-header" class="feedback-header"></div>
          <div id="explain-text" class="explain-text"></div>
          <div id="next-tip" class="next-tip">轻触任意处继续 ➔</div>
        </div>
      </div>
    </div>
  </div>

  <!-- 结算页 -->
  <div id="view-summary" class="view">
    <div class="header-bar">
      <div class="page-title" style="margin: 0 auto;">练习完成报告</div>
    </div>
    <div class="summary-card">
      <div class="score-circle">
        <div id="summary-rate" class="score-num">100%</div>
        <div class="score-label">正确率</div>
      </div>
      <div class="stats-grid">
        <div class="stat-item">
          <div id="summary-total" class="stat-val">137</div>
          <div class="stat-name">本次总题数</div>
        </div>
        <div class="stat-item">
          <div id="summary-correct" class="stat-val" style="color:var(--success);">137</div>
          <div class="stat-name">答对题数</div>
        </div>
        <div class="stat-item">
          <div id="summary-wrong" class="stat-val" style="color:var(--danger);">0</div>
          <div class="stat-name">答错题数</div>
        </div>
        <div class="stat-item">
          <div id="summary-remaining-wrong" class="stat-val">0</div>
          <div class="stat-name">错题库剩余</div>
        </div>
      </div>
    </div>
    <div style="display:flex; flex-direction:column; gap:8px;">
      <button id="btn-summary-wrong" class="btn btn-primary" onclick="startQuiz('wrong')">立即强化复习错题</button>
      <button class="btn btn-secondary" onclick="exitToHome(event)">返回首页</button>
    </div>
  </div>
</div>

const STORAGE_KEY = 'history_exam_wrong_ids_mcq_v1';

let currentMode = 'all'; // 'all' | 'wrong'
let activeQuestions = [];
let currentIndex = 0;
let answeredCurrent = false;
let autoNextTimer = null;

// 统计
let sessionTotal = 0;
let sessionCorrect = 0;
let sessionWrong = 0;

function getWrongIds() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch (e) {
    return [];
  }
}

function saveWrongIds(ids) {
  try {
    localStorage.setItem(STORAGE_KEY, JSON.stringify([...new Set(ids)]));
  } catch (e) {}
}

function addWrongId(id) {
  const ids = getWrongIds();
  if (!ids.includes(id)) {
    ids.push(id);
    saveWrongIds(ids);
  }
}

function removeWrongId(id) {
  const ids = getWrongIds().filter(item => item !== id);
  saveWrongIds(ids);
}

function switchView(viewId) {
  clearTimeout(autoNextTimer);
  document.querySelectorAll('.view').forEach(v => v.classList.remove('active'));
  document.getElementById(viewId).classList.add('active');
}

function refreshHomeStats() {
  const wrongIds = getWrongIds();
  const count = wrongIds.length;
  document.getElementById('wrong-count-header').textContent = `错题待复习: ${count}`;
  const reviewBtn = document.getElementById('btn-review-wrong');
  reviewBtn.textContent = `复习错题库 (${count}题)`;
  if (count === 0) {
    reviewBtn.classList.add('disabled');
    reviewBtn.disabled = true;
  } else {
    reviewBtn.classList.remove('disabled');
    reviewBtn.disabled = false;
  }
}

function startQuiz(mode) {
  currentMode = mode;
  const wrongIds = getWrongIds();

  if (mode === 'wrong') {
    if (wrongIds.length === 0) {
      alert('太棒了！当前错题库为空，无需复习！');
      return;
    }
    activeQuestions = QUESTION_DATABASE.filter(q => wrongIds.includes(q.id));
  } else {
    activeQuestions = [...QUESTION_DATABASE];
  }

  currentIndex = 0;
  sessionTotal = activeQuestions.length;
  sessionCorrect = 0;
  sessionWrong = 0;

  switchView('view-quiz');
  renderCurrentQuestion();
}

function renderCurrentQuestion() {
  clearTimeout(autoNextTimer);
  answeredCurrent = false;
  const q = activeQuestions[currentIndex];

  document.getElementById('quiz-progress-text').textContent = `第 ${currentIndex + 1} / ${activeQuestions.length} 题`;
  document.getElementById('quiz-mode-tag').textContent = currentMode === 'wrong' ? '错题专项' : '全部题库';
  document.getElementById('quiz-mode-tag').style.background = currentMode === 'wrong' ? '#fee2e2' : '#eff6ff';
  document.getElementById('quiz-mode-tag').style.color = currentMode === 'wrong' ? '#b91c1c' : '#1d4ed8';

  const progressPercent = ((currentIndex) / activeQuestions.length) * 100;
  document.getElementById('progress-bar-fill').style.width = `${progressPercent}%`;

  document.getElementById('quiz-chapter-tag').textContent = `${q.chapter} · ${q.section}`;
  document.getElementById('quiz-page-source').textContent = `试卷第${q.page}页 / 第${q.id}题`;

  document.getElementById('question-text').textContent = `${currentIndex + 1}. ${q.question}`;

  // 渲染选项
  const optionsGroup = document.getElementById('options-group');
  optionsGroup.innerHTML = '';
  q.options.forEach((optText) => {
    const key = optText.trim()[0]; // 'A', 'B', 'C', 'D'
    const optDiv = document.createElement('div');
    optDiv.className = 'option-item';
    optDiv.dataset.key = key;
    optDiv.textContent = optText;
    optDiv.onclick = (e) => {
      e.stopPropagation();
      handleSelectOption(key);
    };
    optionsGroup.appendChild(optDiv);
  });

  // 隐藏反馈
  const feedback = document.getElementById('feedback-box');
  feedback.style.display = 'none';
  feedback.className = 'feedback-box';
}

// 点击选项：自动提交并即刻判定！
function handleSelectOption(selectedKey) {
  if (answeredCurrent) return;
  answeredCurrent = true;

  const q = activeQuestions[currentIndex];
  const isRight = (selectedKey === q.answer);

  const feedback = document.getElementById('feedback-box');
  const feedbackHeader = document.getElementById('feedback-header');
  const explainText = document.getElementById('explain-text');
  const nextTip = document.getElementById('next-tip');

  // 标注选项样式并加锁
  document.querySelectorAll('.option-item').forEach(el => {
    el.classList.add('locked');
    const key = el.dataset.key;
    if (key === q.answer) {
      el.classList.add('correct-reveal');
    }
    if (!isRight && key === selectedKey) {
      el.classList.add('wrong-selected');
    }
  });

  if (isRight) {
    sessionCorrect++;
    feedback.className = 'feedback-box correct';
    feedbackHeader.innerHTML = '<span>✅ 回答正确！</span>';
    nextTip.textContent = currentIndex < activeQuestions.length - 1 ? '轻触任意处继续 ➔' : '轻触查看练习报告 ➔';
    if (currentMode === 'wrong') {
      removeWrongId(q.id);
    }
    // 答对时：1.4秒后自动切下一题（或轻触即刻切）
    autoNextTimer = setTimeout(() => {
      goToNext();
    }, 1400);
  } else {
    sessionWrong++;
    feedback.className = 'feedback-box wrong';
    feedbackHeader.innerHTML = `<span>❌ 回答错误！正确答案：【${q.answer}. ${q.correct_text}】</span>`;
    nextTip.textContent = currentIndex < activeQuestions.length - 1 ? '轻触任意处继续 ➔' : '轻触查看练习报告 ➔';
    addWrongId(q.id);
    // 答错时：留出更多时间读答案，也可随时点击屏幕直接跳过
    autoNextTimer = setTimeout(() => {
      goToNext();
    }, 3200);
  }

  explainText.innerHTML = `<strong>考点解析：</strong>${q.explain}`;
  feedback.style.display = 'flex';
}

// 轻触答题区任意位置：若已答题，立即跳过等待进入下一题
function handleTapAnywhere(e) {
  if (answeredCurrent) {
    clearTimeout(autoNextTimer);
    goToNext();
  }
}

function goToNext() {
  clearTimeout(autoNextTimer);
  currentIndex++;
  if (currentIndex < activeQuestions.length) {
    renderCurrentQuestion();
  } else {
    showSummary();
  }
}

// 键盘快捷键监听：按 A/B/C/D 自动判题，任意其他键或Enter/Space立即进入下一题
document.addEventListener('keydown', (e) => {
  const activeView = document.querySelector('.view.active');
  if (activeView && activeView.id === 'view-quiz') {
    const key = e.key.toUpperCase();
    if (!answeredCurrent && ['A', 'B', 'C', 'D'].includes(key)) {
      handleSelectOption(key);
    } else if (answeredCurrent) {
      clearTimeout(autoNextTimer);
      goToNext();
    }
  }
});

function showSummary() {
  clearTimeout(autoNextTimer);
  switchView('view-summary');
  const rate = sessionTotal > 0 ? Math.round((sessionCorrect / sessionTotal) * 100) : 0;
  document.getElementById('summary-rate').textContent = `${rate}%`;
  document.getElementById('summary-total').textContent = sessionTotal;
  document.getElementById('summary-correct').textContent = sessionCorrect;
  document.getElementById('summary-wrong').textContent = sessionWrong;

  const remainingWrong = getWrongIds().length;
  document.getElementById('summary-remaining-wrong').textContent = remainingWrong;

  const wrongBtn = document.getElementById('btn-summary-wrong');
  if (remainingWrong === 0) {
    wrongBtn.textContent = '🎉 错题库已全部清空！';
    wrongBtn.classList.add('disabled');
    wrongBtn.disabled = true;
  } else {
    wrongBtn.textContent = `立即复习错题 (${remainingWrong}题)`;
    wrongBtn.classList.remove('disabled');
    wrongBtn.disabled = false;
  }
}

function exitToHome(e) {
  if (e) e.stopPropagation();
  clearTimeout(autoNextTimer);
  refreshHomeStats();
  switchView('view-home');
}

window.addEventListener('DOMContentLoaded', () => {
  refreshHomeStats();
});
</script>
</body>
</html>
